[workspace]
resolver = "2"
members = [
    "spru",
	"spru-bevy",
	"spru-macro", 
	"spru-message",
	"spru-quibbler", 
	"spru-smol", "spru-test",
	"spru-util",
]

[workspace.dependencies]
telety = "0.2"
amass = "0.1"

halfbrown = { version = "0.2.5", features = ["serde"] }
thiserror = "1.0.50"
anyhow = "1.0.89"

derive_more = "1.0.0"
perfect-derive = "0.1.3"
num-traits = "0.2.17"

rand = { version = "0.8.5", features = [  ] }
rand_chacha = "0.3.1"

rust-fsm = "0.7.0"

# logging
tracing = "0.1.40"

# async
atomicell = "0.2.0"
moro = "0.4.0"

# async (smol ecosystem)
async-broadcast = "0.7.1"
async-lazy = "0.1.0"
async-once-cell = "0.5.3"
async-task = "4.7.1"
async-trait = "0.1.81"
event-listener = "5.3.1"
futures-lite = "2.3.0"
onetime = "0.1.2"
smol = "2.0.0"

# macros
proc-macro2 = "1.0.69"
quote = "1.0.33"
syn = "2.0.38"

sea-bae = "0.2.0"

# serialization
rmp-serde = "=1.3.0"
erased-serde = "0.4.5"
deku = "0.18.1"

[workspace.dependencies.serde]
version = "1.0.189"
features = [
    "std",
    "derive",
    "rc",
]

[workspace.dependencies.bevy]
version = "0.14.0"
default-features = false
features = [
    
]

[patch.crates-io]
telety-macro = { path = "../telety-ws/telety-macro" } 
