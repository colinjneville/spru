[package]
name = "spru-test"
version = "0.1.0"
edition = "2024"

[features]
default = []
smol = ["dep:spru-smol", "dep:smol"]
bevy = []

[dependencies]
spru = { path = "../spru" }
spru-util = { path = "../spru-util" }
spru-smol = { path = "../spru-smol", optional = true }

