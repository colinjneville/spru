[package]
name = "spru-quibbler"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
spru.workspace = true
spru-util.workspace = true
spru-bevy.workspace = true
spru-script.workspace = true
spru-script-rhai.workspace = true

tagset.workspace = true
telety.workspace = true

rand.workspace = true
rand_chacha.workspace = true

rust-fsm.workspace = true

thiserror.workspace = true
anyhow.workspace = true

serde.workspace = true
ron.workspace = true

rhai = { workspace = true, features = ["serde"] }

tracing.workspace = true

url.workspace = true

itertools.workspace = true

wordnik_list = "0.2.1"
bevy-inspector-egui = { version = "0.37.0", optional = true }
bevy_egui = { version = "0.40.1", optional = true }

ehttp = { version = "0.7.1", features = ["native-async"], optional = true }

async-io = { workspace = true, optional = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
# no clipboard on wasm
arboard = "3.6.1"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dependencies.bevy]
workspace = true
features = ["default"]

[build-dependencies]
copy_to_output.workspace = true

[features]
# non-WASM compatible
default = ["hotseat", "join", "host", "dedicated-server"]

# "role" features
hotseat = ["server", "client", "local", "ui"]
join = ["client", "remote", "ui"]
# non-WASM compatible
host = ["server", "client", "remote", "ui", "remote-server"]
dedicated-server = ["server", "remote", "remote-server"]

# sub-features
client = ["spru-bevy/client"]
server = ["spru-bevy/server"]
local = ["spru-bevy/local", "client", "server"]
remote = ["spru-bevy/remote"]
# TODO bevy/bevy_egui should be trimmed for dedicated servers
ui = ["dep:bevy_egui", "dep:bevy-inspector-egui"]
remote-server = ["remote", "server", "dep:async-io", "dep:ehttp"]