[package]
name = "spru-util"
version = "0.1.0"
edition = "2024"
description = "An experimental framework for building multiplayer strategy and digital board games."
license.workspace = true
repository.workspace = true
categories = ["game-development", "wasm"]
keywords = ["gamedev", "framework", "game", "wasm"]

[dev-dependencies]
spru = { workspace = true, features = ["test-util"] }
spru-script-lua.workspace = true
mlua.workspace = true

[dependencies]
spru.workspace = true
spru-macro.workspace = true
spru-script.workspace = true

tagset.workspace = true
telety.workspace = true

derive-where.workspace = true
num-traits.workspace = true
rand.workspace = true
rand_chacha.workspace = true
thiserror.workspace = true

serde.workspace = true

tracing.workspace = true

# feature:fsm
rust-fsm = { workspace = true, optional = true }

[features]
default = ["fsm"]
fsm = ["dep:rust-fsm"]
