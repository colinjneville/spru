[package]
name = "spru-script-macro"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Proc macros for spru-script. Not intended for public use."
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["fold"] }

vacro-parser.workspace = true
vacro-report.workspace = true

spru-script-base-macro.workspace = true